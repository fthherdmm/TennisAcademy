version: '3.4'

services:
  tenis_db:
    image: postgres:16  # <-- BURAYI DEĞİŞTİRDİK (latest yerine 16)
    container_name: TenisAkademi_Db
    environment:
      - POSTGRES_DB=TenisDb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=Tenis123!
    ports:
      - "5433:5432"
    volumes:
      - tenis_pgdata:/var/lib/postgresql/data

volumes:
  tenis_pgdata: